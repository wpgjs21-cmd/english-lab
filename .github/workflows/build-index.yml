name: build-index
# data/ 안의 카드·시험·브리핑 파일이 바뀌면 index.json을 다시 만들어 커밋한다.
on:
  push:
    branches: [main]
    paths: ["data/**", "!data/index.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_index.py
      - name: commit index
        run: |
          git config user.name "english-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || git commit -m "index.json 갱신" && git push
